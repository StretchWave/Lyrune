name: Build & Release LyricScript

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build Executable with PyInstaller (Folder & Single-File Standalone)
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "LyricScript" lyricscript/main.py
          pyinstaller --noconfirm --onefile --windowed --name "LyricScript-Standalone" lyricscript/main.py

      - name: Compress Release Archive
        run: |
          Compress-Archive -Path "dist/LyricScript/*" -DestinationPath "LyricScript-Windows-x64.zip"
          Copy-Item "dist/LyricScript-Standalone.exe" -Destination "LyricScript-Standalone-x64.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LyricScript-Windows-x64
          path: LyricScript-Windows-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libglib2.0-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build Linux Binary with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "LyricScript" lyricscript/main.py

      - name: Archive Linux Release
        run: |
          tar -czvf LyricScript-Linux-x64.tar.gz -C dist/LyricScript .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LyricScript-Linux-x64
          path: LyricScript-Linux-x64.tar.gz

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: LyricScript-Windows-x64

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: LyricScript-Linux-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LyricScript-Standalone-x64.exe
            LyricScript-Windows-x64.zip
            LyricScript-Linux-x64.tar.gz

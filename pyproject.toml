[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyrune"
version = "2.0.0"
description = "Lyrune — desktop lyrics overlay for Spotify — real-time synced lyrics on your screen"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "StretchWave"},
]
keywords = ["spotify", "lyrics", "desktop", "overlay", "lrc", "karaoke", "widget"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Desktop Environment",
]

dependencies = [
    "PyQt6>=6.4.0,<7.0.0",
    "qtawesome>=1.2.0,<2.0.0",
    "requests>=2.28.0,<3.0.0",
]

[project.optional-dependencies]
windows = [
    "winrt-Windows.Media.Control>=3.2.1",
    "winrt-Windows.Foundation>=3.2.1",
    "winrt-Windows.Foundation.Collections>=3.2.1",
    "winrt-Windows.Storage.Streams>=3.2.1",
    "pywin32>=306",
]
linux = [
    "dbus-python>=1.2.18",
]

[project.urls]
Homepage = "https://github.com/StretchWave/Lyrune"
Repository = "https://github.com/StretchWave/Lyrune"
Issues = "https://github.com/StretchWave/Lyrune/issues"

[project.scripts]
lyrune = "lyrune.main:main"

[project.gui-scripts]
lyrune-gui = "lyrune.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lyrune*"]  # whitelist keeps PyInstaller output dirs (dist/ build/) out of the wheel

# No static package data: settings.json lives at the repo root and the runtime
# lyrics cache is stored in the user app-data dir, so nothing extra ships in the wheel.
